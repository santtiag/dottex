<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a3b"/>
      <stop offset="1" stop-color="#121218"/>
    </linearGradient>
    <radialGradient id="glow" cx="330" cy="400" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8385f0" stop-opacity=".34"/>
      <stop offset="1" stop-color="#8385f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".07"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0b2fb"/>
      <stop offset="1" stop-color="#6466e3"/>
    </linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcdcec"/>
    </linearGradient>
  </defs>

  <!-- placa -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#glow)"/>
  <rect x="67" y="67" width="890" height="890" rx="205" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- \ -->
  <path d="M228 258h72l144 508h-72z" fill="url(#slash)" stroke="url(#slash)" stroke-width="28" stroke-linejoin="round"/>

  <!-- d -->
  <circle cx="612" cy="618" r="114" fill="none" stroke="url(#d)" stroke-width="84"/>
  <rect x="716" y="250" width="88" height="524" rx="14" fill="url(#d)"/>
